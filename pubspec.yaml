name: study_clips
description: Study Clips — student social app for Gujarati exam-prep (feed, discuss, chat, premium content).
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Backend
  supabase_flutter: ^2.5.6

  # Fonts (Inter for Latin, Noto Sans Gujarati for Gujarati script)
  google_fonts: ^6.2.1

  # Images
  cached_network_image: ^3.3.1

  # Push notifications
  firebase_core: ^2.31.0
  firebase_messaging: ^14.9.4

  # Payments
  razorpay_flutter: ^1.3.7

  # Utilities
  intl: ^0.19.0
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  # Fonts are loaded via google_fonts package at runtime (no local .ttf needed).
  # If you prefer offline/bundled fonts, drop .ttf files in assets/fonts/
  # and declare them here.
